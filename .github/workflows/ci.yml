# Every action is pinned to a full commit SHA with its version in a comment.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ShellCheck and publishing test (fedora:44)
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -q -y install git ShellCheck rpm-build rpm-sign gnupg2 createrepo_c dpkg-dev pacman bsdtar zstd openssl
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/*.sh
      - name: Site pages and assets
        run: |
          bash tests/check-site.sh
          bash tests/test-check-site.sh
      - name: Publishing refuses unsigned packages and an unset key
        run: bash tests/test-build-repo.sh
      - name: The installer trusts only the checked CA and the pinned key
        run: |
          bash tests/test-install-ca.sh
          bash tests/test-install-key.sh
          bash tests/test-install-pacman.sh

  install:
    name: Installer end to end (podman, systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The latest packages from main of the code and rules repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest green CI run on main that still has artifact $2: a
          # docs-only merge makes a green run with no packages.
          latest() {
            gh api "repos/openvibes-project/$1/actions/artifacts?name=$2&per_page=30" \
              --jq '.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main") | .workflow_run.id' |
              while read -r id; do
                [ "$(gh api "repos/openvibes-project/$1/actions/runs/$id" --jq .conclusion)" = success ] && { echo "$id"; break; }
              done
          }
          gh run download "$(latest openvibes-platform rpms)" -R openvibes-project/openvibes-platform -n rpms -D rpms/platform
          agent_run=$(latest openvibes-agent agent-rpms)
          gh run download "$agent_run" -R openvibes-project/openvibes-agent -n agent-rpms -D rpms/agent
          gh run download "$agent_run" -R openvibes-project/openvibes-agent -n agent-debs -D rpms/agent
          gh run download "$agent_run" -R openvibes-project/openvibes-agent -n agent-arch -D rpms/agent
          gh run download "$(latest openvibes-rules rules-rpms)" -R openvibes-project/openvibes-rules -n rules-rpms -D rpms/rules
          mkdir rpms/all
          cp rpms/platform/openvibes-{ingest,distribution,vulns,admin}-[0-9]*.x86_64.rpm rpms/all/
          # The lowest version of each: CI also builds a next-patch test package.
          cp "$(ls -v rpms/agent/openvibes-agent-[0-9]*.x86_64.rpm | head -1)" rpms/all/
          cp "$(ls -v rpms/agent/openvibes-agent_*_amd64.deb | head -1)" rpms/all/
          cp "$(ls -v rpms/agent/openvibes-agent-[0-9]*-x86_64.pkg.tar.zst | head -1)" rpms/all/
          cp rpms/rules/openvibes-rules-baseline-[0-9]*.noarch.rpm rpms/all/
          ls rpms/all
      - name: Install the platform, enroll agents on every supported system, check the refusals
        run: bash tests/install-e2e.sh rpms/all
