# Every action is pinned to a full commit SHA with its version in a comment.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ShellCheck and publishing test (fedora:44)
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tools
        run: dnf -q -y install git ShellCheck rpm-build rpm-sign gnupg2 createrepo_c
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/*.sh
      - name: Publishing refuses unsigned packages and an unset key
        run: bash tests/test-build-repo.sh

  install:
    name: Installer end to end (podman, systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The latest RPMs from main of the code and rules repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() { gh run list -R "openvibes-project/$1" --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'; }
          gh run download "$(latest openvibes-platform)" -R openvibes-project/openvibes-platform -n rpms -D rpms/platform
          gh run download "$(latest openvibes-agent)" -R openvibes-project/openvibes-agent -n agent-rpms -D rpms/agent
          gh run download "$(latest openvibes-rules)" -R openvibes-project/openvibes-rules -n rules-rpms -D rpms/rules
          mkdir rpms/all
          cp rpms/platform/openvibes-{ingest,distribution,vulns,admin}-[0-9]*.x86_64.rpm rpms/all/
          cp "$(ls -v rpms/agent/openvibes-agent-[0-9]*.x86_64.rpm | head -1)" rpms/all/
          cp rpms/rules/openvibes-rules-baseline-[0-9]*.noarch.rpm rpms/all/
          ls rpms/all
      - name: Install the platform, enroll an agent, check the refusals
        run: bash tests/install-e2e.sh rpms/all
